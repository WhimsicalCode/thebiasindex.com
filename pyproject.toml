[project]
name = "thebiasindex"
version = "0.1.0"
description = "thebiasindex.com: a transparent, weekly index of how fair SaaS comparison pages are."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "html2text>=2024.2",
    "httpx>=0.27",
    "lxml>=5.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
review = [
    "google-genai>=1.0",
    "openai>=1.50",
    "streamlit>=1.40",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
