# Companies monitored by thebiasindex.com, checked by pipeline/companies.py before every run.
# - `category` groups companies on the site and in the data (pipeline/companies.py lists them).
# - `domain` is the company's identity: its page is thebiasindex.com/<domain>. Written by hand, never derived.
# - `aliases` are other domains people know it by; their pages redirect to the domain.
# - `hosts` are crawled. Only URLs on these hosts (or subdomains of `domain`) count for the company.
# - `sitemaps` is optional: by default the crawler reads the `Sitemap:` lines of each host's robots.txt,
#   then falls back to /sitemap.xml.
# - `not_mentions` is optional: other products whose name contains one of `product_names` ("Resource Guru" for Guru),
#   so pipeline/mentions.py doesn't count them as this company.
