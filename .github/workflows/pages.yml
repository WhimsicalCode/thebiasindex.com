name: Deploy to GitHub Pages

# Builds the site from the latest data release and publishes it to GitHub Pages on every push to main. The weekly
# run also calls this workflow after publishing new data.
# The address comes from GitHub (configure-pages), so it follows the repository name and any custom domain.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: pages
        uses: actions/configure-pages@v5

      - name: Get the latest data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download --pattern bias_index.sqlite --dir data

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Build
        working-directory: web
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          DIRECTORY_URLS: "true"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
